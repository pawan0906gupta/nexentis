:root {
  /* the invite's own world: cream paper, peach florals, terracotta script; one phone-width column */
  --paper: #f7efe6;
  --night: #e9dccf;
  --rose: #ad6646;
  --ink: #6a5249;
  --gold: #b48c45;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--night); }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.locked { overflow: hidden; height: 100%; }
.col { position: relative; width: 100%; max-width: 480px; margin: 0 auto; box-shadow: 0 0 40px rgba(110, 70, 50, .18); }
.page { position: relative; width: 100%; aspect-ratio: 900 / 9103; background: var(--paper); }
.tiles { position: absolute; inset: 0; display: flex; flex-direction: column; }
.tiles img { display: block; width: 100%; flex: none; }
.page > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.page a.map { position: absolute; display: block; border-radius: 999px; }
.page a.map:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#scratch, #hint { position: absolute; }
.col.walled { overflow: hidden; }
.wall { position: absolute; left: 0; right: 0; pointer-events: none; display: flex; align-items: flex-end; justify-content: center;
  background: linear-gradient(180deg, rgba(255, 253, 248, 0) 0%, rgba(255, 253, 248, .9) 55%, #fffdf8 100%); }
.wall span { margin-bottom: 14px; color: #8a6638; font: 600 10.5px/1.4 Cinzel, Georgia, serif; letter-spacing: 2.5px; text-indent: 2.5px; text-align: center; }
#scratch { touch-action: none; cursor: grab; }
#hint { pointer-events: none; mix-blend-mode: screen; }
#petals { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 480px); height: 100%; pointer-events: none; z-index: 20; }
.gate { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 480px); height: 100%; z-index: 15;
  border: 0; padding: 0; margin: 0; background: #2a120c; cursor: pointer; overflow: hidden; display: block; perspective: 1100px; }
.gate:focus-visible { outline: 2px solid var(--gold); outline-offset: -5px; }
.door { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 2; will-change: transform; overflow: hidden; backface-visibility: hidden; }
.door svg { width: 100%; height: 100%; display: block; }
.door.l { left: 0; transform-origin: 0% 50%; } .door.r { right: 0; transform-origin: 100% 50%; }
.door .shade { position: absolute; inset: 0; opacity: 0; }
.door.l .shade { background: linear-gradient(90deg, rgba(36, 14, 8, .25), rgba(36, 14, 8, .7)); }
.door.r .shade { background: linear-gradient(270deg, rgba(36, 14, 8, .25), rgba(36, 14, 8, .7)); }
.gfx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
.glow { position: absolute; top: 0; bottom: 0; left: 50%; z-index: 1; transform: translateX(-50%); width: 4%; opacity: 0;
  background: radial-gradient(ellipse 50% 46% at 50% 49%, rgba(255, 251, 243, .9) 0%, rgba(255, 238, 214, .55) 45%, rgba(255, 230, 200, 0) 100%); }
.seam { position: absolute; z-index: 3; top: 0; bottom: 0; left: 50%; width: 5px; transform: translateX(-50%); opacity: 0;
  background: linear-gradient(180deg, rgba(255, 226, 180, 0), #ffe3b4 12%, #fffaf0 50%, #ffe3b4 88%, rgba(255, 226, 180, 0));
  box-shadow: 0 0 14px 4px rgba(255, 214, 160, .8), 0 0 40px 12px rgba(250, 196, 140, .38); }
.flare { position: absolute; z-index: 4; left: 50%; top: 49%; width: 30%; aspect-ratio: 1; border-radius: 50%; opacity: 0; pointer-events: none;
  transform: translate(-50%, -50%) scale(.2);
  background: radial-gradient(circle, #fffdf8 0%, #fff5e6 20%, rgba(255, 230, 200, .8) 36%, rgba(250, 208, 170, .3) 54%, rgba(250, 200, 160, 0) 70%); }
.ripple { position: absolute; z-index: 5; left: 50%; top: 49%; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; opacity: 0;
  background: radial-gradient(circle, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, .25) 45%, rgba(255, 255, 255, 0) 70%);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .6); }
.cue { position: fixed; z-index: 18; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); opacity: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px; color: #8a6638;
  font: 600 10.5px/1 Cinzel, Georgia, serif; letter-spacing: 3px; text-indent: 3px; text-shadow: 0 0 6px #fbf4ea, 0 0 12px #fbf4ea; }
.cue svg { width: 20px; height: 20px; filter: drop-shadow(0 0 4px #fbf4ea); }
.music { position: fixed; z-index: 25; top: max(12px, env(safe-area-inset-top)); right: max(12px, calc(50vw - 240px + 12px));
  width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; display: none; place-items: center; cursor: pointer;
  background: rgba(255, 250, 244, .9); color: var(--rose); box-shadow: inset 0 0 0 1px rgba(180, 140, 69, .6), 0 3px 10px rgba(90, 40, 30, .18); }
.music svg { width: 18px; height: 18px; }
.music:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.music .off { display: none; } .music.muted .on { display: none; } .music.muted .off { display: block; }
