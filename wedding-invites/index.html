:root {
  /* the invite's own world: cream paper, peach florals, terracotta script; one phone-width column */
  --paper: #f7efe6;
  --night: #e9dccf;
  --rose: #ad6646;
  --ink: #6a5249;
  --gold: #b48c45;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--night); }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.locked { overflow: hidden; height: 100%; }
.col { position: relative; width: 100%; max-width: 480px; margin: 0 auto; box-shadow: 0 0 40px rgba(110, 70, 50, .18); }
.page { position: relative; width: 100%; background: var(--paper); }
.tiles { position: absolute; inset: 0; display: flex; flex-direction: column; }
.tiles img { display: block; width: 100%; flex: none; }
.page > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.page a.map { position: absolute; display: block; border-radius: 999px; }
.page a.map:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#scratch, #hint { position: absolute; }
.col.walled { overflow: hidden; }
.wall { position: absolute; left: 0; right: 0; pointer-events: none; display: flex; align-items: flex-end; justify-content: center;
  background: linear-gradient(180deg, rgba(255, 253, 248, 0) 0%, rgba(255, 253, 248, .9) 55%, #fffdf8 100%); }
.wall span { margin-bottom: 14px; color: #8a6638; font: 600 10.5px/1.4 Cinzel, Georgia, serif; letter-spacing: 2.5px; text-indent: 2.5px; text-align: center; }
#scratch { touch-action: none; cursor: grab; }
#hint { pointer-events: none; mix-blend-mode: screen; }
#petals { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 480px); height: 100%; pointer-events: none; z-index: 20; }
.gate { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 480px); height: 100%; z-index: 15;
  border: 0; padding: 0; margin: 0; background: #2a120c; cursor: pointer; overflow: hidden; display: block; perspective: 1100px; }
.gate:focus-visible { outline: 2px solid var(--gold); outline-offset: -5px; }
.door { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 2; will-change: transform; overflow: hidden; backface-visibility: hidden; }
.door svg { width: 100%; height: 100%; display: block; }
.door.l { left: 0; transform-origin: 0% 50%; } .door.r { right: 0; transform-origin: 100% 50%; }
.door .shade { position: absolute; inset: 0; opacity: 0; }
.door.l .shade { background: linear-gradient(90deg, rgba(36, 14, 8, .25), rgba(36, 14, 8, .7)); }
.door.r .shade { background: linear-gradient(270deg, rgba(36, 14, 8, .25), rgba(36, 14, 8, .7)); }
.gfx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
.glow { position: absolute; top: 0; bottom: 0; left: 50%; z-index: 1; transform: translateX(-50%); width: 4%; opacity: 0;
  background: radial-gradient(ellipse 50% 46% at 50% 49%, rgba(255, 251, 243, .9) 0%, rgba(255, 238, 214, .55) 45%, rgba(255, 230, 200, 0) 100%); }
.seam { position: absolute; z-index: 3; top: 0; bottom: 0; left: 50%; width: 5px; transform: translateX(-50%); opacity: 0;
  background: linear-gradient(180deg, rgba(255, 226, 180, 0), #ffe3b4 12%, #fffaf0 50%, #ffe3b4 88%, rgba(255, 226, 180, 0));
  box-shadow: 0 0 14px 4px rgba(255, 214, 160, .8), 0 0 40px 12px rgba(250, 196, 140, .38); }
.flare { position: absolute; z-index: 4; left: 50%; top: 49%; width: 30%; aspect-ratio: 1; border-radius: 50%; opacity: 0; pointer-events: none;
  transform: translate(-50%, -50%) scale(.2);
  background: radial-gradient(circle, #fffdf8 0%, #fff5e6 20%, rgba(255, 230, 200, .8) 36%, rgba(250, 208, 170, .3) 54%, rgba(250, 200, 160, 0) 70%); }
.ripple { position: absolute; z-index: 5; left: 50%; top: 49%; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; opacity: 0;
  background: radial-gradient(circle, rgba(255, 255, 255, .55) 0%, rgba(255, 255, 255, .25) 45%, rgba(255, 255, 255, 0) 70%);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .6); }
.cue { position: fixed; z-index: 18; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); opacity: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px; color: #8a6638;
  font: 600 10.5px/1 Cinzel, Georgia, serif; letter-spacing: 3px; text-indent: 3px; text-shadow: 0 0 6px #fbf4ea, 0 0 12px #fbf4ea; }
.cue svg { width: 20px; height: 20px; filter: drop-shadow(0 0 4px #fbf4ea); }
.music { position: fixed; z-index: 25; top: max(12px, env(safe-area-inset-top)); right: max(12px, calc(50vw - 240px + 12px));
  width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; display: none; place-items: center; cursor: pointer;
  background: rgba(255, 250, 244, .9); color: var(--rose); box-shadow: inset 0 0 0 1px rgba(180, 140, 69, .6), 0 3px 10px rgba(90, 40, 30, .18); }
.music svg { width: 18px; height: 18px; }
.music:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.music .off { display: none; } .music.muted .on { display: none; } .music.muted .off { display: block; }
body.rec .music, body.rec .cue, body.rec .wall span { display: none !important; }
.rsvp { background: var(--paper); padding: 18px 22px 34px; text-align: center; color: var(--ink); }
.rsvp .orn { display: block; width: 46%; margin: 0 auto 10px; }
.rsvp .kick { margin: 0; font: 600 11.5px/1.4 Cinzel, Georgia, serif; letter-spacing: 4px; text-indent: 4px; color: #8a6638; }
.rsvp h2 { margin: 2px 0 4px; font: 400 46px/1.15 "Great Vibes", cursive; color: #a3573a; }
.rsvp .lede { margin: 0 auto 18px; max-width: 30ch; font: italic 500 17px/1.4 "Cormorant Garamond", Georgia, serif; color: #7d5547; }
.rsvp form { margin: 0 auto; max-width: 400px; text-align: left; padding: 22px 20px 20px; border-radius: 18px;
  background: rgba(255, 252, 247, .9); box-shadow: inset 0 0 0 1px rgba(180, 140, 69, .45), 0 10px 26px rgba(122, 74, 51, .1); }
.rsvp .lab { display: block; margin: 0 0 8px; font: 600 10.5px/1.3 Cinzel, Georgia, serif; letter-spacing: 2px; color: #7a5f4f; }
.rsvp .f { margin: 0 0 18px; border: 0; padding: 0; min-width: 0; }
.rsvp input[type=text], .rsvp textarea { width: 100%; border: 0; border-bottom: 1px solid rgba(160, 120, 80, .45); background: transparent; border-radius: 0;
  padding: 6px 2px 7px; font: 500 19px/1.35 "Cormorant Garamond", Georgia, serif; color: #4f3a32; outline: none; -webkit-appearance: none; appearance: none; }
.rsvp textarea { resize: none; min-height: 84px; border: 1px solid rgba(160, 120, 80, .35); border-radius: 10px; padding: 9px 11px; background: rgba(255, 255, 255, .5); }
.rsvp input[type=text]:focus, .rsvp textarea:focus { border-color: #b48c45; }
.rsvp ::placeholder { color: #b09a8c; font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-block; padding: 8px 14px; border-radius: 999px; font: 500 16px/1.2 "Cormorant Garamond", Georgia, serif; color: #6a5249;
  background: rgba(255, 255, 255, .7); box-shadow: inset 0 0 0 1px rgba(180, 140, 69, .55); transition: background .25s, color .25s, box-shadow .25s; }
.chip input:checked + span { background: #a3573a; color: #fff8f0; box-shadow: inset 0 0 0 1px #a3573a, 0 3px 10px rgba(163, 87, 58, .25); }
.chip input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
.chips.n .chip span { min-width: 48px; text-align: center; font: 600 14px/1.35 Cinzel, Georgia, serif; }
.rsvp .when-yes { display: none; } .rsvp.yes .when-yes { display: block; }
.rsvp .err { display: none; margin: 6px 0 0; font: italic 500 15px/1.3 "Cormorant Garamond", Georgia, serif; color: #b0472b; }
.rsvp .bad .err { display: block; }
.rsvp button.send { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; margin-top: 4px; padding: 14px 16px; border: 0; border-radius: 999px; cursor: pointer;
  font: 600 12.5px/1 Cinzel, Georgia, serif; letter-spacing: 2.2px; color: #fff8f0; background: linear-gradient(180deg, #b4633f, #97492d);
  box-shadow: 0 6px 16px rgba(151, 73, 45, .3), inset 0 1px 0 rgba(255, 255, 255, .25); }
.rsvp button.send svg { width: 18px; height: 18px; }
.rsvp button.send:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

        var sx0 = ((j * .3819 + .07) % 1) * PW, yy = -24 + (95 + 70 * ((j * 7) % 5) / 4) * ee, im = spr[j % spr.length];
        if (yy > PH + 30 || !im.complete) continue;
        var sz = 11 + 8 * ((j * 3) % 4) / 3;
        px.save(); px.globalAlpha = .9 * clamp(ee / .3, 0, 1); px.translate(sx0 + 22 * Math.sin(ee * 1.7 + j), yy); px.rotate((j * 47 + 140 * ee) * Math.PI / 180);

      }
    }
    /* sparkles and petal bursts anchored to the page */
    for (var q = fx.length - 1; q >= 0; q--) {
      var f = fx[q], e = (t - f.t) / (f.kind === "burst" ? 1.6 : 1.5);
      if (e < 0) continue; if (e > 1) { fx.splice(q, 1); continue; }
      var P = toScreen(f.x, f.y), k = P[2];
      for (var n = 0; n < f.n; n++) {

        var X = P[0] + Math.cos(a) * rr, Y = P[1] + Math.sin(a) * rr * .85 + (f.kind === "burst" ? 60 * k * e * e : -18 * k * e);
        if (f.kind === "burst") {
          var im2 = spr[n % spr.length]; if (!im2.complete) continue;
          var s2 = 10 + 6 * (n % 3);
          px.save(); px.globalAlpha = .95 * (1 - e * e); px.translate(X, Y); px.rotate((n * 53 + 300 * e) * Math.PI / 180); px.drawImage(im2, -s2 / 2, -s2 / 2, s2, s2); px.restore();
        } else {

        }

    }

  }

  /* ---------- the rest of the invite opens only once the date has been revealed ---------- */
  var WALL = 4600, wallEl = $("wall"), walled = true;
  function sizeWall() { if (walled) col.style.height = (WALL * page.clientWidth / 900).toFixed(1) + "px"; }
  function drawWall(t) {

    var e = reduce ? 1 : (t - st.scratchT) / .6;
    wallEl.style.opacity = f3(1 - easeOut(e));

  }

  /* ---------- RSVP & wishes: builds a WhatsApp message to the couple ---------- */
  var WA = "918440882811", rs = $("rsvp"), rf = $("rsvpForm");
  if (rs && rf) {
    if ("IntersectionObserver" in window && !reduce) {

    } else rs.classList.add("in");
    /* errors clear while typing / on choosing, never on blur, so nothing jumps under a guest's finger */
    rf.addEventListener("input", function (e) { if (e.target.name === "name" && e.target.value.trim()) $("fName").classList.remove("bad"); });
    rf.addEventListener("change", function (e) {
      var a = rf.querySelector('input[name="att"]:checked');

      $("fName").classList.toggle("bad", !name); $("fAtt").classList.toggle("bad", !att);
      if (!name || !att) { (!name ? rf.elements.name : $("fAtt").querySelector("input")).focus(); return; }
      var yes = att.value === "yes", L = ["\uD83D\uDE4F RSVP \u2013 Pawan & Meha\u2019s Wedding", "", "Name: " + name,
        "Attending: " + (yes ? "Yes, joyfully! \uD83C\uDF89" : "Sorry, can\u2019t make it \u2013 sending blessings \uD83D\uDC90")];
      if (yes) {
        if (rf.querySelector('input[name="guests"]')) { var g = rf.querySelector('input[name="guests"]:checked'); L.push("Guests: " + (g ? g.value : "1")); }
        var ev = Array.prototype.map.call(rf.querySelectorAll('input[name="ev"]:checked'), function (x) { return x.value; });
        if (rf.querySelector('input[name="ev"]')) L.push("Joining: " + (ev.length ? ev.join(", ") : "\u2013"));
      }
      var w = rf.elements.wish.value.trim(); if (w) { L.push(""); L.push("Wishes: " + w); }
      var url = "https://wa.me/" + WA + "?text=" + encodeURIComponent(L.join("\n"));
      var win = window.open(url, "_blank"); if (win) { try { win.opener = null; } catch (er) {} } else window.location.href = url;
    });
  }

  /* ---------- clock ---------- */
  var t0 = performance.now() / 1000;
  function now() { return REC ? st.t : performance.now() / 1000 - t0; }
  function frame(t) { st.t = t; drawWall(t); drawGate(t); drawHero(t); drawCue(t); drawReveal(t); drawCount(t); drawScratch(t); drawPetals(t); }

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
  window.__api = { frame: frame, openGate: openGate, scratchTo: scratchTo, lift: function () { last = null; }, checkDone: checkDone, st: st };
})();
